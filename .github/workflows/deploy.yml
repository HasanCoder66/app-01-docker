name: Deploy to AWS EC2 with Docker

on:
  push:
    branches:
      - main  # You can change this to any branch you want to trigger the deployment

jobs:
  deploy:
    runs-on: ubuntu-latest  # Runs on GitHub-hosted Ubuntu environment
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Store your Docker Hub username in GitHub secrets
          password: ${{ secrets.DOCKER_PASSWORD }}  # Store your Docker Hub password in GitHub secrets

      - name: Build and push Docker image to Docker Hub
        run: |
          docker build -t hasancoder66/smit-b-17-north:latest . 
          docker push hasancoder66/smit-b-17-north

      - name: Set up SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private-key.pem
          chmod 600 private-key.pem

      - name: Set EC2 permissions for SSH key
        run: chmod 600 private-key.pem

      - name: Deploy Docker image to EC2
        run: |
          ssh -i private-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} <<EOF
            sudo docker pull hasancoder66/smit-b-17-north:latest
            sudo docker stop smit-b-17-north || true
            sudo docker rm smit-b-17-north || true
            sudo docker run -d --name smit-b-17-north -p 3000:3000 hasancoder66/smit-b-17-north:latest
          EOF